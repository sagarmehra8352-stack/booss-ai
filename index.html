<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOOSS AI - Script to Video Maker</title>
<style>
body{background:#0f0f0f;color:white;font-family:Arial;padding:15px}
.box{background:#1e1e1e;padding:20px;border-radius:15px;max-width:700px;margin:auto}
textarea{width:100%;height:150px;background:#2a2a2a;color:white;border:none;padding:15px;border-radius:10px;font-size:16px}
select,button{width:100%;padding:13px;margin-top:10px;border-radius:10px;border:none;font-size:16px}
select{background:#2a2a2a;color:white}
button{background:linear-gradient(90deg,#ff00cc,#3333ff);color:white;font-weight:bold}
#preview{margin-top:20px;background:#000;min-height:300px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#888;text-align:center;padding:15px}
.tag{display:inline-block;background:#333;padding:5px 10px;border-radius:20px;margin:5px;font-size:12px}
</style>
</head>
<body>
<div class="box">
<h2>🎬 BOOSS AI Video Maker</h2>
<p>Bas Script Paste Karo, Video Banao!</p>
<textarea id="script" placeholder="Yahan apni story paste karo..."></textarea>
<select id="type">
<option value="short">Short Video (30 sec - 9:16)</option>
<option value="long">Long Video (5 min - 16:9)</option>
</select>
<select id="voice">
<option value="horror">Horror Voice (Ladki)</option>
<option value="boy">Boy Voice Hindi</option>
<option value="motivational">Motivational Voice</option>
</select>
<select id="style">
<option value="2d">2D Cartoon Style</option>
<option value="real">Realistic Style</option>
<option value="anime">Anime Style</option>
</select>
<button onclick="generate()">🚀 VIDEO GENERATE KARO</button>
<div id="preview">Preview yahan dikhega...</div>
<div><span class="tag">✓ Auto Images</span><span class="tag">✓ Auto Voiceover</span><span class="tag">✓ Auto Music</span><span class="tag">✓ Auto Subtitles</span></div>
</div>
<script>
function generate(){
  const script = document.getElementById('script').value;
  if(!script){alert('Pehle script likho BOOSS!'); return;}
  document.getElementById('preview').innerHTML = "⏳ AI Video Bana Raha Hai...<br><br>1. Scenes bana raha hai...<br>2. Images generate ho rahi hai...<br>3. Voiceover + Music add ho raha hai...";
  setTimeout(()=>{
    document.getElementById('preview').innerHTML = "✅ VIDEO READY! <br><br>" + script.substring(0,100) + "...<br><br><button onclick='alert(\"Download shuru!\")'>📥 DOWNLOAD VIDEO</button>";
  }, 4000);
}
</script>
</body>
</html>
